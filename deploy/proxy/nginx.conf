# nginx in front of Tazamun from deploy/compose/docker-compose.yml (DEP-19).
# Put this in /etc/nginx/conf.d/ and replace the domain and certificate paths
# (for example from certbot).

server {
    listen 80;
    listen [::]:80;
    server_name sync.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sync.example.org;

    ssl_certificate     /etc/letsencrypt/live/sync.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sync.example.org/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # nginx's default is 1 MB, below the API's 2 MiB batches (SRS 4.4.1).
    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # $proxy_add_x_forwarded_for appends the client's address, which is the entry the
        # server trusts with TAZAMUN_TRUST_PROXY=true.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
