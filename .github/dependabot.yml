# DEP-37: keep npm packages, GitHub Actions and Docker base images up to date.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tooling:
        dependency-type: development
    ignore:
      # typescript-eslint supports only typescript <6.1 (see CLAUDE.md, Tooling pitfalls).
      # Remove once a typescript-eslint release supports TypeScript 7.
      - dependency-name: typescript
        versions: ['>=6.1.0']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Base image digests in deploy/docker/Dockerfile. Every update goes through the image build
  # and smoke test (DEP-29).
  - package-ecosystem: docker
    directory: /deploy/docker
    schedule:
      interval: weekly
